<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>Chess Duel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="atmosphere__glow atmosphere__glow--a"></div>
    <div class="atmosphere__glow atmosphere__glow--b"></div>
    <div class="atmosphere__grain"></div>
  </div>

  <section id="menu" class="screen screen--menu">
    <div class="menu-shell">
      <header class="menu-hero">
        <p class="brand" aria-label="Chess Duel">CHESS DUEL</p>
        <p class="tagline">Two players. One board. First to <em>two checkmates</em> takes the match.</p>
      </header>

      <div id="profile-root" class="menu-profile"></div>

      <nav class="menu-actions" aria-label="Game modes">
        <button class="btn btn--primary" id="btn-offline" type="button">
          <span class="btn__label">Offline Dual Player</span>
          <span class="btn__meta">Pass &amp; play</span>
        </button>
        <button class="btn btn--secondary" id="btn-host" type="button">
          <span class="btn__label">Host Online Match</span>
          <span class="btn__meta">You play White</span>
        </button>
        <div class="join-panel">
          <label class="sr-only" for="join-code">Room code</label>
          <input id="join-code" type="text" maxlength="6" placeholder="ROOM CODE" autocomplete="off" inputmode="numeric" />
          <button class="btn btn--secondary btn--compact" id="btn-join" type="button">Join</button>
        </div>
        <p class="hint" id="menu-hint">Sign in, then pick a mode.</p>
      </nav>
    </div>
  </section>

  <section id="game" class="screen screen--game hidden">
    <header class="hud">
      <div class="hud__identity">
        <p class="hud__brand">CHESS DUEL</p>
        <p class="turn" id="turn-label">White to move</p>
        <p class="score" id="score-label">Match 0–0 · first to 2</p>
      </div>
      <div class="hud__actions">
        <p class="status" id="status-label">Ready</p>
        <button class="btn btn--ghost btn--compact" id="btn-menu" type="button">Menu</button>
      </div>
    </header>

    <div class="board-stage">
      <div class="board-frame">
        <div class="board-rail board-rail--files" aria-hidden="true">
          <span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span>
        </div>
        <div class="board-mid">
          <div class="board-rail board-rail--ranks" aria-hidden="true">
            <span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span>
          </div>
          <div id="board" class="board" role="grid" aria-label="Chess board"></div>
          <div class="board-rail board-rail--ranks board-rail--ranks-end" aria-hidden="true">
            <span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span>
          </div>
        </div>
        <div class="board-rail board-rail--files" aria-hidden="true">
          <span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span>
        </div>
      </div>
    </div>

    <footer class="hud-footer">
      <button class="btn btn--primary btn--compact" id="btn-new" type="button">Next Game</button>
    </footer>
  </section>

  <div id="promo-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="promo-title">
    <div class="modal-card">
      <p id="promo-title" class="modal-title">Promote pawn</p>
      <p class="modal-sub">Choose the piece</p>
      <div class="promo-choices">
        <button type="button" data-promo="q" aria-label="Queen">♕</button>
        <button type="button" data-promo="r" aria-label="Rook">♖</button>
        <button type="button" data-promo="b" aria-label="Bishop">♗</button>
        <button type="button" data-promo="n" aria-label="Knight">♘</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
